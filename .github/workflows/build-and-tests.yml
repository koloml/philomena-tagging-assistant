name: Testing

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
            - 'release/**'

jobs:
    run-tests:
        name: 'Run Unit Tests'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '25'

            -   name: Install npm dependencies
                run: npm ci

            -   name: Building the extension
                run: npm run build

            -   name: Running unit tests
                run: npm run test
